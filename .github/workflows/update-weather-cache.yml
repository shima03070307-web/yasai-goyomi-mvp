name: Update weather cache

on:
  schedule:
    - cron: "0 6,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-cache
  cancel-in-progress: false

jobs:
  update-weather-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Open-Meteo weather cache
        run: python scripts/build_weather_cache.py

      - name: Commit weather cache
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather-cache.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No weather cache changes."
            exit 0
          fi
          git commit -m "Update weather cache"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit.outputs.changed == 'true' && secrets.CF_PAGES_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "${{ secrets.CF_PAGES_DEPLOY_HOOK }}"
